<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10261f">
<link rel="manifest" href="manifest.webmanifest">
<title>Nano LED</title>
<style>
  :root {
    color-scheme: dark;
    --pcb: #10261f;
    --pcb-hi: #183a2f;
    --silver: #d9e2dc;
    --muted: #8fa89c;
    --led-on: #ffb020;
    --led-off: #2a4a3e;
    --err: #ff7a6b;
    --font: "Bahnschrift", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { min-height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  #principale, #calendario { display: flex; flex-direction: column; flex: 1; }
  body {
    background: var(--pcb);
    color: var(--silver);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    max-width: 520px;
    margin: 0 auto;
  }
  header { padding: 20px 0 8px; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .01em; }
  #stato { color: var(--muted); font-size: .95rem; min-height: 1.4em; }
  #stato.ok { color: var(--led-on); }
  #stato.errore { color: var(--err); }

  button {
    font: inherit;
    color: inherit;
    border: 2px solid var(--silver);
    background: transparent;
    border-radius: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--led-on); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  #connetti {
    margin: 12px 0 20px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 600;
  }
  #connetti.connesso { border-color: var(--led-on); color: var(--led-on); }

  #ora {
    margin: -8px 0 20px;
    padding: 10px;
    font-size: .95rem;
    border-color: var(--led-off);
    color: var(--muted);
  }
  .leds { display: grid; gap: 14px; flex: 1; align-content: start; }
  .led {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 20px;
    background: var(--pcb-hi);
    border-color: var(--led-off);
    text-align: left;
    transition: border-color .15s, background .15s;
  }
  .led .lamp {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--led-off);
    border: 2px solid var(--muted);
    transition: background .15s, box-shadow .15s, border-color .15s;
  }
  .led .nome { font-size: 1.25rem; font-weight: 600; display: block; }
  .led .info { color: var(--muted); font-size: .9rem; }
  .led.on { border-color: var(--led-on); }
  .led.on .lamp {
    background: var(--led-on);
    border-color: #ffe0a0;
    box-shadow: 0 0 22px 6px rgba(255, 176, 32, .55);
  }
  .led.on .info { color: var(--led-on); }

  #log {
    margin: 20px 0 16px;
    padding: 10px 12px;
    background: rgba(0,0,0,.25);
    border-radius: 10px;
    font: .8rem/1.5 ui-monospace, Consolas, monospace;
    color: var(--muted);
    height: 7.5em;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  #apriCal, .aggiungi, #indietro, #annulla { padding: 12px; border-color: var(--led-off); color: var(--muted); }
  #apriCal { margin-top: 18px; }
  #indietro, #annulla { margin-top: 16px; align-self: flex-start; padding: 8px 14px; }
  .vista-cal h2 { font-size: 1rem; margin: 22px 0 10px; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { flex: 1 0 20%; padding: 10px 0; border-color: var(--led-off); }
  .chip[aria-pressed="true"] { border-color: var(--led-on); color: var(--led-on); background: var(--pcb-hi); }
  .scorciatoie { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .scorciatoie button { padding: 6px 12px; font-size: .85rem; border-color: var(--led-off); color: var(--muted); }
  .fascia { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  .fascia label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  .fascia input { font: inherit; padding: 10px; background: var(--pcb-hi); color: var(--silver); border: 2px solid var(--led-off); border-radius: 10px; }
  .rimuovi { flex: none; width: 44px; height: 44px; border-color: var(--led-off); color: var(--muted); }
  .vuoto { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
  #conferma { margin: 22px 0 6px; padding: 16px; font-size: 1.1rem; font-weight: 600; border-color: var(--led-on); color: var(--led-on); }
  #errore { min-height: 1.4em; margin-bottom: 8px; color: var(--err); font-size: .9rem; }
  .giorno { display: grid; gap: 2px; padding: 10px 12px; margin-bottom: 8px; background: var(--pcb-hi); border-radius: 10px; font-size: .85rem; color: var(--muted); }
  .giorno b { color: var(--silver); }
  .nota { margin: 0 0 14px; color: var(--muted); font-size: .85rem; }
  .regola { display: grid; gap: 4px; padding: 12px; margin-bottom: 10px; background: var(--pcb-hi); border-radius: 10px; font-size: .85rem; color: var(--muted); }
  .regola .titolo { color: var(--silver); font-weight: 600; font-size: .95rem; }
  .azioni { display: flex; gap: 8px; margin-top: 6px; }
  .azioni button { flex: 1; padding: 8px; border-color: var(--led-off); color: var(--silver); }
  .periodo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; }
  .periodo select { font: inherit; padding: 8px; background: var(--pcb-hi); color: var(--silver); border: 2px solid var(--led-off); border-radius: 8px; }
  .mese { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .mese b { flex: 0 0 100%; color: var(--muted); font-size: .85rem; text-transform: uppercase; }
  .gd { width: 38px; height: 38px; padding: 0; border-width: 1px; border-color: var(--led-off); border-radius: 8px; font-size: .8rem; }
  .gd[aria-pressed="true"] { background: var(--led-on); color: var(--pcb); border-color: var(--led-on); }
  #applica { margin: 22px 0 6px; padding: 16px; font-size: 1.1rem; font-weight: 600; border-color: var(--led-on); color: var(--led-on); }
  #erroreRegola { min-height: 1.4em; color: var(--err); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="principale">
<header>
  <h1>Nano LED</h1>
  <div id="stato" role="status" aria-live="polite">Non connesso</div>
</header>

<button id="connetti" type="button">Connetti</button>
<button id="ora" type="button" disabled>Imposta ora dal telefono</button>

<div class="leds">
  <button id="led1" class="led" type="button" disabled>
    <span class="lamp"></span>
    <span><span class="nome">LED 1</span><span class="info">Pin 11 · stato sconosciuto</span></span>
  </button>
  <button id="led2" class="led" type="button" disabled>
    <span class="lamp"></span>
    <span><span class="nome">LED 2</span><span class="info">Pin 12 · stato sconosciuto</span></span>
  </button>
</div>

<button id="apriCal" type="button" disabled>Modifica calendario</button>
<div id="log" aria-label="Messaggi dall'Arduino"></div>
</div>

<section id="calendario" class="vista-cal" hidden>
  <div id="elenco">
    <button id="indietro" type="button">← Indietro</button>
    <h1>Calendario annuale</h1>
    <p class="nota">Dal 1 gennaio al 31 dicembre. Se più regole valgono nello stesso giorno, vince quella più in basso.</p>
    <div id="regole"></div>
    <button id="nuova" class="aggiungi" type="button">+ Nuova regola</button>
    <button id="conferma" type="button">Conferma modifica</button>
    <div id="errore" role="alert"></div>
  </div>
  <div id="editor" hidden>
    <button id="annulla" type="button">← Annulla</button>
    <h1 id="titoloRegola">Regola</h1>
    <h2>Giorni della settimana</h2>
    <div id="giorni" class="chips"></div>
    <h2>Date dell’anno</h2>
    <div class="periodo">
      Dal <select id="dg"></select><select id="dm"></select>
      al <select id="ag"></select><select id="am"></select>
    </div>
    <div class="scorciatoie">
      <button id="addPeriodo" type="button">Aggiungi periodo</button>
      <button id="tuttoAnno" type="button">Tutto l’anno</button>
      <button id="svuotaDate" type="button">Svuota</button>
    </div>
    <div id="anno"></div>
    <h2>LED 1</h2><div id="fasce0"></div>
    <button id="agg0" class="aggiungi" type="button">+ Aggiungi fascia</button>
    <h2>LED 2</h2><div id="fasce1"></div>
    <button id="agg1" class="aggiungi" type="button">+ Aggiungi fascia</button>
    <button id="applica" type="button">Applica regola</button>
    <div id="erroreRegola" role="alert"></div>
  </div>
</section>

<script>
"use strict";

// Servizi BLE seriali più diffusi (HM-10 / JDY / CC41 = FFE0, altri = FFF0, Nordic UART)
const SERVIZI = [
  0xffe0,
  0xfff0,
  0xffe5,
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e",
  "0000ffe0-0000-1000-8000-00805f9b34fb"
];

const el = {
  stato: document.getElementById("stato"),
  connetti: document.getElementById("connetti"),
  ora: document.getElementById("ora"),
  log: document.getElementById("log"),
  led: { 1: document.getElementById("led1"), 2: document.getElementById("led2") }
};
const PIN = { 1: 11, 2: 12 };

let device = null;
let charScrittura = null;
let charNotifica = null;
let bufferRx = "";
const enc = new TextEncoder();
const dec = new TextDecoder();

function setStato(testo, classe) {
  el.stato.textContent = testo;
  el.stato.className = classe || "";
}

function log(riga) {
  el.log.textContent += riga + "\n";
  el.log.scrollTop = el.log.scrollHeight;
}

function mostraLed(n, acceso) {
  const b = el.led[n];
  b.classList.toggle("on", acceso);
  b.querySelector(".info").textContent = "Pin " + PIN[n] + " · " + (acceso ? "acceso" : "spento");
}

function resetLed() {
  [1, 2].forEach(n => {
    el.led[n].classList.remove("on");
    el.led[n].querySelector(".info").textContent = "Pin " + PIN[n] + " · stato sconosciuto";
  });
}

function abilitaLed(si) {
  el.ora.disabled = !si;
  el.led[1].disabled = !si;
  el.led[2].disabled = !si;
}

// Risposte dell'Arduino: "Pin 11: ON" / "Pin 12: OFF"
function gestisciRiga(riga) {
  riga = riga.trim();
  if (!riga) return;
  if (gestisciCalendario(riga)) return;
  log("< " + riga);
  const m = /Pin\s*(11|12)\s*:\s*(ON|OFF)/i.exec(riga);
  if (m) mostraLed(m[1] === "11" ? 1 : 2, m[2].toUpperCase() === "ON");
}

function allaNotifica(ev) {
  bufferRx += dec.decode(ev.target.value);
  let i;
  while ((i = bufferRx.search(/[\r\n]/)) >= 0) {
    gestisciRiga(bufferRx.slice(0, i));
    bufferRx = bufferRx.slice(i + 1);
  }
}

async function trovaCaratteristiche(server) {
  for (const uuid of SERVIZI) {
    let servizio;
    try { servizio = await server.getPrimaryService(uuid); } catch (e) { continue; }
    const chars = await servizio.getCharacteristics();
    let scrivi = null, notifica = null;
    for (const c of chars) {
      if (!notifica && (c.properties.notify || c.properties.indicate)) notifica = c;
      if (!scrivi && (c.properties.write || c.properties.writeWithoutResponse)) scrivi = c;
    }
    // Nordic UART ha due caratteristiche, HM-10 una sola per entrambe le direzioni
    if (scrivi) return { scrivi, notifica };
  }
  throw new Error("Nessun servizio seriale BLE trovato su questo dispositivo");
}

async function connetti() {
  if (!navigator.bluetooth) {
    setStato("Web Bluetooth non disponibile: usa Chrome su Android", "errore");
    return;
  }
  el.connetti.disabled = true;
  try {
    setStato("Cerco il modulo…");
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: SERVIZI
    });
    device.addEventListener("gattserverdisconnected", alDisconnesso);
    setStato("Connessione a " + (device.name || "dispositivo") + "…");
    const server = await device.gatt.connect();
    const { scrivi, notifica } = await trovaCaratteristiche(server);
    charScrittura = scrivi;
    charNotifica = notifica;
    if (notifica) {
      await notifica.startNotifications();
      notifica.addEventListener("characteristicvaluechanged", allaNotifica);
    }
    bufferRx = "";
    setStato("Connesso a " + (device.name || "dispositivo"), "ok");
    el.connetti.textContent = "Disconnetti";
    el.connetti.classList.add("connesso");
    abilitaLed(true);
    log("Connesso. Tocca un LED per commutarlo.");
    await inviaOra();
    regoleInArrivo = [];
    await invia("G\n");
  } catch (e) {
    if (e.name === "NotFoundError") setStato("Nessun dispositivo selezionato");
    else setStato("Errore: " + e.message, "errore");
    pulisci();
  } finally {
    el.connetti.disabled = false;
  }
}

function pulisci() {
  mostraVista(false);
  $("apriCal").disabled = true;
  $("conferma").disabled = true;
  charScrittura = null;
  charNotifica = null;
  abilitaLed(false);
  resetLed();
  el.connetti.textContent = "Connetti";
  el.connetti.classList.remove("connesso");
}

function alDisconnesso() {
  pulisci();
  setStato("Connessione persa. Premi Connetti per riprovare", "errore");
}

function disconnetti() {
  if (device && device.gatt.connected) {
    device.removeEventListener("gattserverdisconnected", alDisconnesso);
    device.gatt.disconnect();
  }
  pulisci();
  setStato("Non connesso");
}

let coda = Promise.resolve();
// Scrive a blocchi da 20 byte, in ordine, anche per testi lunghi
function scrivi(testo) {
  coda = coda.then(async () => {
    if (!charScrittura) return;
    const dati = enc.encode(testo);
    for (let i = 0; i < dati.length; i += 20) {
      const pezzo = dati.slice(i, i + 20);
      if (charScrittura.properties.write) await charScrittura.writeValue(pezzo);
      else await charScrittura.writeValueWithoutResponse(pezzo);
    }
  }).catch(e => setStato("Invio fallito: " + e.message, "errore"));
  return coda;
}

async function invia(testo) {
  await scrivi(testo);
  log("> " + testo.trim());
}

// Invia l'ora locale del telefono nel formato T + AAAAMMGGhhmmss (15 caratteri)
function inviaOra() {
  const d = new Date();
  const p = (n, l = 2) => String(n).padStart(l, "0");
  const testo = "T" + p(d.getFullYear(), 4) + p(d.getMonth() + 1) + p(d.getDate()) +
                p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  return invia(testo + "\n");
}

// ---- Calendario annuale ----
// Una regola = date dell’anno (bit per ogni giorno, febbraio sempre 29) + giorni della settimana + fasce dei due LED.
// Se più regole valgono nello stesso giorno, vince l’ultima della lista.
const GIORNI = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
const GG = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const CUM = [0, 31, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
const MAX_FASCE = 4, MAX_REGOLE = 20;
const $ = id => document.getElementById(id);
const nuovaRegola = () => ({ date: new Uint8Array(46), giorni: 127, fasce: [[], []] });
const copia = r => ({ date: r.date.slice(), giorni: r.giorni, fasce: JSON.parse(JSON.stringify(r.fasce)) });
const bit = (u, i) => (u[i >> 3] >> (i & 7)) & 1;
const imposta = (u, i, v) => { if (v) u[i >> 3] |= 1 << (i & 7); else u[i >> 3] &= ~(1 << (i & 7)); };
const hex = u => [...u].map(b => b.toString(16).padStart(2, "0")).join("");
const daHex = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
const slotsTesto = f => f.map(t => (t.on + t.off).replace(/:/g, "")).join("");
const daSlots = s => (s.match(/\d{8}/g) || []).map(t => ({
  on: t.slice(0, 2) + ":" + t.slice(2, 4), off: t.slice(4, 6) + ":" + t.slice(6, 8) }));
let regole = [], regoleInArrivo = [], inAttesa = false, inModifica = -1, bozza = nuovaRegola();

function mostraVista(cal) {
  $("principale").hidden = cal;
  $("calendario").hidden = !cal;
  window.scrollTo(0, 0);
}

function mostraPannello(editor) {
  $("elenco").hidden = editor;
  $("editor").hidden = !editor;
  window.scrollTo(0, 0);
}

// Righe dalla scheda: R<date><giorni>,<fasce LED1>,<fasce LED2> e CE a fine elenco
function gestisciCalendario(riga) {
  let m;
  if ((m = /^R([0-9A-Fa-f]{92})([0-9A-Fa-f]{2}),(\d*),(\d*)$/.exec(riga))) {
    regoleInArrivo.push({ date: daHex(m[1]), giorni: parseInt(m[2], 16), fasce: [daSlots(m[3]), daSlots(m[4])] });
    return true;
  }
  if (riga === "CE") {
    regole = regoleInArrivo;
    $("apriCal").disabled = false;
    disegnaRegole();
    log("Calendario letto dalla scheda.");
    return true;
  }
  if (riga === "Calendario salvato" && inAttesa) {
    inAttesa = false;
    mostraVista(false);
    setStato("Calendario salvato nella scheda", "ok");
    log("Calendario salvato.");
    return true;
  }
  if (riga === "Calendario non valido") {
    inAttesa = false;
    $("conferma").disabled = false;
    $("errore").textContent = "La scheda ha rifiutato il calendario";
    return true;
  }
  return false;
}

const dataTesto = i => {
  let m = 11;
  while (CUM[m] > i) m--;
  return (i - CUM[m] + 1) + " " + MESI[m];
};

function riassunto(r) {
  let n = 0, a = -1, b = -1;
  for (let i = 0; i < 366; i++) if (bit(r.date, i)) { n++; if (a < 0) a = i; b = i; }
  const gg = r.giorni === 127 ? "tutti i giorni"
    : GIORNI.filter((_, i) => (r.giorni >> i) & 1).join(" ") || "nessun giorno";
  const f = x => x.length ? x.map(t => t.on + "–" + t.off).join(", ") : "spento";
  return [n ? `${n} date, dal ${dataTesto(a)} al ${dataTesto(b)}` : "nessuna data", gg,
          "LED 1: " + f(r.fasce[0]), "LED 2: " + f(r.fasce[1])];
}

function disegnaRegole() {
  const box = $("regole");
  box.textContent = "";
  if (!regole.length) {
    const p = document.createElement("p");
    p.className = "vuoto";
    p.textContent = "Nessuna regola: i LED restano spenti";
    box.append(p);
  }
  regole.forEach((r, i) => {
    const c = document.createElement("div");
    c.className = "regola";
    riassunto(r).forEach((t, k) => {
      const sp = document.createElement("span");
      if (!k) sp.className = "titolo";
      sp.textContent = t;
      c.append(sp);
    });
    const az = document.createElement("div");
    az.className = "azioni";
    [["Modifica", () => apriEditor(i)],
     ["Elimina", () => { regole.splice(i, 1); disegnaRegole(); }]].forEach(([t, f]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t;
      b.addEventListener("click", f);
      az.append(b);
    });
    c.append(az);
    box.append(c);
  });
  $("nuova").hidden = regole.length >= MAX_REGOLE;
}

function disegnaChips() {
  [...$("giorni").children].forEach((b, i) => b.setAttribute("aria-pressed", ((bozza.giorni >> i) & 1) === 1));
}

function disegnaAnno() {
  document.querySelectorAll(".gd").forEach(b =>
    b.setAttribute("aria-pressed", bit(bozza.date, +b.dataset.i) === 1));
}

function disegnaBozza() {
  [0, 1].forEach(led => {
    const lista = bozza.fasce[led];
    const box = $("fasce" + led);
    box.textContent = "";
    if (!lista.length) {
      const p = document.createElement("p");
      p.className = "vuoto";
      p.textContent = "Nessuna fascia: sempre spento";
      box.append(p);
    }
    lista.forEach((f, i) => {
      const riga = document.createElement("div");
      riga.className = "fascia";
      [["on", "Accendi"], ["off", "Spegni"]].forEach(([k, titolo]) => {
        const l = document.createElement("label");
        l.textContent = titolo;
        const inp = document.createElement("input");
        inp.type = "time";
        inp.value = f[k];
        inp.addEventListener("input", () => { f[k] = inp.value; });
        l.append(inp);
        riga.append(l);
      });
      const x = document.createElement("button");
      x.type = "button";
      x.className = "rimuovi";
      x.textContent = "✕";
      x.setAttribute("aria-label", "Rimuovi fascia");
      x.addEventListener("click", () => { lista.splice(i, 1); disegnaBozza(); });
      riga.append(x);
      box.append(riga);
    });
    $("agg" + led).hidden = lista.length >= MAX_FASCE;
  });
}

function apriEditor(i) {
  inModifica = i;
  bozza = i >= 0 ? copia(regole[i]) : nuovaRegola();
  $("titoloRegola").textContent = i >= 0 ? "Modifica regola" : "Nuova regola";
  $("erroreRegola").textContent = "";
  disegnaChips();
  disegnaAnno();
  disegnaBozza();
  mostraPannello(true);
}

// Costruzione una tantum dell’editor
GIORNI.forEach((g, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.textContent = g;
  b.addEventListener("click", () => { bozza.giorni ^= 1 << i; disegnaChips(); });
  $("giorni").append(b);
});
MESI.forEach((nome, k) => {
  const bl = document.createElement("div");
  bl.className = "mese";
  const t = document.createElement("b");
  t.textContent = nome;
  bl.append(t);
  for (let d = 1; d <= GG[k]; d++) {
    const i = CUM[k] + d - 1;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "gd";
    b.textContent = d;
    b.dataset.i = i;
    b.addEventListener("click", () => { imposta(bozza.date, i, !bit(bozza.date, i)); disegnaAnno(); });
    bl.append(b);
  }
  $("anno").append(bl);
});
["dg", "ag"].forEach(id => {
  for (let d = 1; d <= 31; d++) $(id).add(new Option(d, d));
});
["dm", "am"].forEach(id => MESI.forEach((m, k) => $(id).add(new Option(m, k))));
$("ag").value = 31;
$("am").value = 11;

$("addPeriodo").addEventListener("click", () => {
  const dm = +$("dm").value, am = +$("am").value, dg = +$("dg").value, ag = +$("ag").value;
  if (dg > GG[dm] || ag > GG[am]) { $("erroreRegola").textContent = "Giorno non valido per quel mese"; return; }
  const fine = CUM[am] + ag - 1;
  for (let i = CUM[dm] + dg - 1; ; i = (i + 1) % 366) {   // se la fine precede l’inizio, il periodo passa il 31 dicembre
    imposta(bozza.date, i, 1);
    if (i === fine) break;
  }
  $("erroreRegola").textContent = "";
  disegnaAnno();
});
$("tuttoAnno").addEventListener("click", () => {
  for (let i = 0; i < 366; i++) imposta(bozza.date, i, 1);
  disegnaAnno();
});
$("svuotaDate").addEventListener("click", () => { bozza.date.fill(0); disegnaAnno(); });
[0, 1].forEach(led => $("agg" + led).addEventListener("click", () => {
  bozza.fasce[led].push({ on: "", off: "" });
  disegnaBozza();
}));

$("applica").addEventListener("click", () => {
  const e = t => { $("erroreRegola").textContent = t; };
  if (!bozza.date.some(x => x)) return e("Seleziona almeno una data");
  if (!bozza.giorni) return e("Seleziona almeno un giorno della settimana");
  for (const led of bozza.fasce) for (const f of led) {
    if (!f.on || !f.off) return e("Compila tutti gli orari");
    if (f.on === f.off) return e("Accensione e spegnimento non possono coincidere");
  }
  if (inModifica >= 0) regole[inModifica] = bozza; else regole.push(bozza);
  disegnaRegole();
  mostraPannello(false);
});
$("annulla").addEventListener("click", () => mostraPannello(false));
$("nuova").addEventListener("click", () => apriEditor(-1));
$("indietro").addEventListener("click", () => mostraVista(false));
$("apriCal").addEventListener("click", () => {
  $("errore").textContent = "";
  $("conferma").disabled = false;
  disegnaRegole();
  mostraPannello(false);
  mostraVista(true);
});

$("conferma").addEventListener("click", async () => {
  if (!regole.length && !confirm("Nessuna regola: i LED resteranno spenti. Confermi?")) return;
  let testo = "KS\n";
  regole.forEach(r => {
    testo += "R" + hex(r.date) + r.giorni.toString(16).padStart(2, "0") + "," +
             slotsTesto(r.fasce[0]) + "," + slotsTesto(r.fasce[1]) + "\n";
  });
  testo += "KE" + String(regole.length).padStart(2, "0") + "\n";
  inAttesa = true;
  $("conferma").disabled = true;
  $("errore").textContent = "Invio in corso…";
  await scrivi(testo);
  setTimeout(() => {
    if (inAttesa) {
      inAttesa = false;
      $("conferma").disabled = false;
      $("errore").textContent = "La scheda non ha confermato: riprova";
    }
  }, 20000);
});

el.ora.addEventListener("click", inviaOra);

el.connetti.addEventListener("click", () => {
  if (device && device.gatt && device.gatt.connected) disconnetti();
  else connetti();
});
el.led[1].addEventListener("click", () => invia("1"));
el.led[2].addEventListener("click", () => invia("2"));

// Service worker: permette l'uso offline quando la pagina è servita via HTTPS o localhost
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
